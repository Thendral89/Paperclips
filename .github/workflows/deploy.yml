name: Deploy Paperclip CRM

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Apply migrations, push secrets, deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          preCommands: |
            npx wrangler d1 migrations apply paperclip-crm --remote
            [ -n "${{ secrets.GOOGLE_CLIENT_ID }}" ] && echo "${{ secrets.GOOGLE_CLIENT_ID }}" | npx wrangler secret put GOOGLE_CLIENT_ID || echo "::warning::GOOGLE_CLIENT_ID repo secret is not set — skipping, leaving whatever is already live untouched"
            [ -n "${{ secrets.GOOGLE_CLIENT_SECRET }}" ] && echo "${{ secrets.GOOGLE_CLIENT_SECRET }}" | npx wrangler secret put GOOGLE_CLIENT_SECRET || echo "::warning::GOOGLE_CLIENT_SECRET repo secret is not set — skipping, leaving whatever is already live untouched"
            [ -n "${{ secrets.SESSION_SECRET }}" ] && echo "${{ secrets.SESSION_SECRET }}" | npx wrangler secret put SESSION_SECRET || echo "::warning::SESSION_SECRET repo secret is not set — skipping, leaving whatever is already live untouched"
          command: deploy
