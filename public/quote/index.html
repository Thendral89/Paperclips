<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paperclip Studios — Your Quote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#211A12; --ink-soft:#7A6C58; --ink-faint:#A79A85;
    --paper:#FAF6EF; --paper-dim:#F1EADC; --card:#FFFFFF; --line:#E6DCC7;
    --accent:#9C6B2E; --accent-deep:#6E4A1E; --accent-soft:#F3E7D2;
    --success:#3F7D5C; --success-soft:#E6F1EA;
    --warning:#B4791E; --warning-soft:#FBF0DE;
    --critical:#B5432E; --critical-soft:#FBE9E3;
    --font-display:'Instrument Serif',Georgia,serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',-apple-system,'Segoe UI',sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:560px;margin:0 auto;padding:36px 18px 70px;}
  .brandmark{font-family:var(--font-display);font-weight:400;font-size:15px;letter-spacing:.02em;color:var(--accent-deep);margin:0 0 14px;}
  h1{font-family:var(--font-display);font-weight:400;font-size:34px;margin:0 0 4px;letter-spacing:.002em;}
  .sub{color:var(--ink-soft);font-size:13.5px;margin-bottom:22px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(33,26,18,0.04);}
  .card h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin:0 0 12px;}
  .card h2 .hint{text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink-faint);}
  .item-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px;}
  .item-row:last-child{border-bottom:none;}
  .item-row.addon{cursor:pointer;}
  .item-row .label{display:flex;align-items:center;gap:8px;}
  .check{width:16px;height:16px;flex:0 0 auto;color:var(--success);}
  .item-price{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;}
  .toggle{width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;flex:0 0 auto;transition:background .15s;}
  .toggle.on{background:var(--success);}
  .toggle::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2);}
  .toggle.on::after{transform:translateX(16px);}
  .included-tag{font-size:10.5px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.03em;}
  .summary-row{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;font-variant-numeric:tabular-nums;}
  .summary-row.total{font-size:20px;font-weight:400;font-family:var(--font-display);color:var(--accent-deep);border-top:1px solid var(--line);margin-top:8px;padding-top:12px;}
  .summary-row.concession{color:var(--success);}
  .note{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}
  .error-screen{padding:60px 20px;text-align:center;color:var(--ink-soft);}
  .valid-banner{background:var(--warning-soft);color:var(--warning);border-radius:9px;padding:9px 13px;font-size:12.5px;font-weight:600;margin-bottom:16px;}
  .thread{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;max-height:320px;overflow-y:auto;}
  .bubble{max-width:84%;padding:9px 12px;border-radius:12px;font-size:13.5px;line-height:1.45;word-wrap:break-word;}
  .bubble.customer{background:var(--accent-soft);color:var(--accent-deep);align-self:flex-end;border-bottom-right-radius:3px;}
  .bubble.studio{background:var(--paper-dim);align-self:flex-start;border-bottom-left-radius:3px;}
  .bubble .meta{font-size:10px;color:var(--ink-faint);margin-top:4px;}
  .bubble.customer .meta{color:var(--accent-deep);opacity:.65;}
  .thread-empty{font-size:13px;color:var(--ink-faint);margin-bottom:12px;}
  .msg-form{display:flex;gap:8px;align-items:flex-end;}
  .msg-form textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:13.5px;color:var(--ink);background:var(--paper);min-height:44px;max-height:120px;}
  .msg-form textarea:focus{outline:none;border-color:var(--accent);}
  .msg-form button{flex:0 0 auto;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:0 18px;height:44px;font-size:13.5px;font-weight:600;cursor:pointer;transition:background .15s,transform .1s;}
  .msg-form button:hover{background:var(--accent-deep);}
  .msg-form button:disabled{opacity:.5;cursor:default;}
  .msg-error{color:var(--critical);font-size:12px;margin-top:6px;}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="brandmark">Paperclip Studios</div>Loading…</div>
<script>
  const token = location.pathname.split("/")[2];
  let data = null;

  function money(n) { return `₹${(n || 0).toLocaleString("en-IN")}`; }
  function escapeHtml(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

  async function load() {
    const res = await fetch(`/api/quote/${token}`);
    if (!res.ok) {
      document.getElementById("app").innerHTML =
        `<div class="error-screen"><div class="brandmark">Paperclip Studios</div><h1>Quote not found</h1><p>This link may have expired or been mistyped. Please check with the studio for a fresh link.</p></div>`;
      return;
    }
    data = await res.json();
    render();
  }

  function commentThread(comments) {
    if (!comments || !comments.length) return `<div class="thread-empty">No messages yet — ask a question below and the studio will reply here.</div>`;
    return `<div class="thread">${comments.map(c => `
      <div class="bubble ${c.author}">
        ${escapeHtml(c.message)}
        <div class="meta">${c.author === "studio" ? "Paperclip Studios" : "You"} · ${c.created_at}</div>
      </div>`).join("")}</div>`;
  }

  function render() {
    const base = data.items.filter(i => !i.is_addon);
    const addons = data.items.filter(i => i.is_addon);
    document.getElementById("app").innerHTML = `
      <div class="brandmark">Paperclip Studios</div>
      <h1>Your quote</h1>
      <div class="sub">${data.lead_name || ""} — ${data.event_type || "your event"}${data.tier_name ? ` · ${data.tier_name}` : ""}</div>
      ${data.valid_until ? `<div class="valid-banner">Valid until ${data.valid_until}</div>` : ""}

      <div class="card">
        <h2>What's included</h2>
        ${base.map(i => `<div class="item-row"><span class="label"><svg class="check" viewBox="0 0 20 20" fill="none"><path d="M4 10.5l4 4 8-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>${i.label}</span><span class="item-price">${money(i.price)}</span></div>`).join("") || `<div class="note">Nothing added yet.</div>`}
      </div>

      ${addons.length ? `<div class="card">
        <h2>Optional add-ons <span class="hint">— tap to include or remove</span></h2>
        ${addons.map(i => `
          <div class="item-row addon" data-item="${i.id}" data-selected="${i.selected ? 1 : 0}">
            <span>${i.label}</span>
            <span style="display:flex;align-items:center;gap:10px;">
              <span class="item-price">${money(i.price)}</span>
              <span class="toggle ${i.selected ? "on" : ""}"></span>
            </span>
          </div>
        `).join("")}
      </div>` : ""}

      <div class="card">
        <h2>Summary</h2>
        <div class="summary-row"><span>Subtotal</span><span class="item-price">${money(data.subtotal)}</span></div>
        ${data.concession_amount > 0 ? `<div class="summary-row concession"><span>Special discount${data.concession_note ? ` — ${data.concession_note}` : ""}</span><span class="item-price">−${money(data.concession_amount)}</span></div>` : ""}
        <div class="summary-row total"><span>Total</span><span>${money(data.total)}</span></div>
      </div>

      <div class="card">
        <h2>Questions or requests <span class="hint">— ask for an add-on, a change, anything</span></h2>
        ${commentThread(data.comments)}
        <form id="msgForm" class="msg-form">
          <textarea id="msgInput" placeholder="e.g. Can you add a second videographer?" maxlength="2000" required></textarea>
          <button type="submit" id="msgSend">Send</button>
        </form>
        <div id="msgErr" class="msg-error" style="display:none;"></div>
      </div>
    `;
    document.querySelectorAll(".item-row.addon").forEach(el => {
      el.addEventListener("click", async () => {
        const itemId = el.dataset.item;
        const nowSelected = el.dataset.selected !== "1";
        el.style.opacity = "0.6";
        try {
          const res = await fetch(`/api/quote/${token}/toggle`, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ item_id: Number(itemId), selected: nowSelected }),
          });
          if (!res.ok) throw new Error();
          const item = data.items.find(i => i.id === Number(itemId));
          item.selected = nowSelected;
          data.subtotal = data.items.filter(i => i.selected).reduce((s, i) => s + i.price, 0);
          data.total = Math.max(0, Math.round(data.subtotal * (data.multiplier || 1)) - (data.concession_amount || 0));
          render();
        } catch {
          el.style.opacity = "1";
        }
      });
    });

    const form = document.getElementById("msgForm");
    const input = document.getElementById("msgInput");
    const sendBtn = document.getElementById("msgSend");
    const errEl = document.getElementById("msgErr");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      errEl.style.display = "none";
      sendBtn.disabled = true;
      sendBtn.textContent = "Sending…";
      try {
        const res = await fetch(`/api/quote/${token}/comment`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ message }),
        });
        if (!res.ok) throw new Error();
        data.comments = data.comments || [];
        data.comments.push({ author: "customer", message, created_at: "just now" });
        render();
        // Keep focus in the message flow after re-render.
        document.getElementById("msgInput")?.focus();
      } catch {
        sendBtn.disabled = false;
        sendBtn.textContent = "Send";
        errEl.textContent = "Couldn't send that — please try again.";
        errEl.style.display = "block";
      }
    });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
    });
  }

  load();
</script>
</body>
</html>
