<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paperclip Studios — Event portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#211A12; --ink-soft:#7A6C58; --ink-faint:#A79A85;
    --paper:#FAF6EF; --card:#FFFFFF; --line:#E6DCC7;
    --accent:#9C6B2E; --accent-deep:#6E4A1E; --accent-soft:#F3E7D2;
    --success:#3F7D5C; --success-soft:#E6F1EA;
    --warning:#B4791E; --warning-soft:#FBF0DE;
    --critical:#B5432E;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',-apple-system,'Segoe UI',sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:520px;margin:0 auto;padding:36px 18px 70px;}
  .brandmark{font-family:'Fraunces',serif;font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-deep);margin:0 0 14px;}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:22px;margin:0 0 3px;letter-spacing:-.01em;}
  .sub{color:var(--ink-soft);font-size:13px;margin-bottom:20px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(33,26,18,0.04);}
  .card h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin:0 0 12px;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  td{padding:6px 0;border-bottom:1px solid var(--line);}
  td:first-child{color:var(--ink-soft);width:40%;}
  tr:last-child td{border-bottom:none;}
  .field{margin-bottom:12px;}
  label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;margin-bottom:5px;}
  input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;font-size:14px;}
  button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 16px;font-size:13.5px;font-weight:700;cursor:pointer;}
  .row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .row:last-child{border-bottom:none;}
  .pill{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:100px;}
  .pill.pending{background:var(--warning-soft);color:var(--warning);}
  .pill.ok{background:var(--success-soft);color:var(--success);}
  .msg{margin-top:10px;font-size:13px;}
  .msg.err{color:var(--critical);}
  .error-screen{padding:60px 20px;text-align:center;color:var(--ink-soft);}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="brandmark">Paperclip Studios</div>Loading…</div>
<script>
  const token = location.pathname.split("/")[2];

  async function load() {
    const res = await fetch(`/api/portal/${token}`);
    if (!res.ok) {
      document.getElementById("app").innerHTML =
        `<div class="error-screen"><div class="brandmark">Paperclip Studios</div><h1>Link not valid</h1><p>This link may have expired or been mistyped. Check with the studio for a fresh link.</p></div>`;
      return;
    }
    const data = await res.json();
    render(data);
  }

  function render(d) {
    document.getElementById("app").innerHTML = `
      <div class="brandmark">Paperclip Studios</div>
      <h1>${d.event.type} — ${d.event.account_name}</h1>
      <div class="sub">Signed in as ${d.staff_name} · scoped to this event only</div>

      <div class="card">
        <h2>Event details</h2>
        <table>
          <tr><td>Date</td><td>${d.event.event_date || "TBD"}</td></tr>
          <tr><td>Venue</td><td>${d.event.venue || "—"}</td></tr>
          <tr><td>Status</td><td>${d.event.status}</td></tr>
        </table>
      </div>

      <div class="card">
        <h2>Your tasks</h2>
        ${d.tasks.length ? d.tasks.map(t => `
          <div class="row">
            <span>${t.task}${!t.mine ? ` <span class="pill" style="background:var(--warning-soft);color:var(--warning);">${t.staff_name || "assigned to someone else"}</span>` : ""}</span>
            ${t.mine
              ? `<select data-task="${t.id}" ${t.status === "Done" ? 'style="color:var(--success);font-weight:700;"' : ""}>${["Pending","In progress","Done"].map(s => `<option ${s===t.status?"selected":""}>${s}</option>`).join("")}</select>`
              : `<span class="pill ${t.status === "Done" ? "ok" : "pending"}">${t.status}</span>`}
          </div>`).join("") : `<div class="sub">No tasks assigned yet.</div>`}
      </div>

      <div class="card">
        <h2>Log an expense</h2>
        <form id="expenseForm">
          <div class="field"><label>Category</label>
            <select name="category"><option>Travel — fuel</option><option>Accommodation</option><option>Equipment rental</option><option>Other</option></select>
          </div>
          <div class="field"><label>Amount (₹)</label><input name="amount" type="number" required></div>
          <div class="field"><label>Note</label><input name="note"></div>
          <button type="submit">Submit expense</button>
          <div class="msg" id="expenseMsg"></div>
        </form>
      </div>

      <div class="card">
        <h2>Need something?</h2>
        <form id="supportForm">
          <div class="field"><label>What do you need</label><textarea name="request" rows="2" placeholder="e.g. extra 70-200mm lens for the reception" required></textarea></div>
          <button type="submit">Send request</button>
          <div class="msg" id="supportMsg"></div>
        </form>
      </div>

      <div class="card">
        <h2>Submitted this event</h2>
        ${
          [...d.expenses.map(e => `<div class="row">${e.category} <span class="pill ok">₹${e.amount}</span></div>`),
           ...d.support_requests.map(r => `<div class="row">${r.request} <span class="pill ${r.status === 'pending' ? 'pending' : 'ok'}">${r.status}</span></div>`)]
          .join("") || `<div class="sub">Nothing submitted yet.</div>`
        }
      </div>
    `;

    document.getElementById("expenseForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target).entries());
      const res = await fetch(`/api/portal/${token}/expenses`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(data) });
      const out = await res.json();
      const m = document.getElementById("expenseMsg");
      if (!res.ok) { m.className = "msg err"; m.textContent = out.error; return; }
      load();
    });
    document.getElementById("supportForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target).entries());
      const res = await fetch(`/api/portal/${token}/support`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(data) });
      const out = await res.json();
      const m = document.getElementById("supportMsg");
      if (!res.ok) { m.className = "msg err"; m.textContent = out.error; return; }
      load();
    });
    document.querySelectorAll("[data-task]").forEach(el => el.addEventListener("change", async (e) => {
      await fetch(`/api/portal/${token}/tasks/${el.dataset.task}/status`, {
        method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ status: e.target.value }),
      });
      load();
    }));
  }

  load();
</script>
</body>
</html>
