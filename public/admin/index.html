    }
    if(activeSection==="crm"){
      const grouped={}; (cfg.custom_fields||[]).forEach(f=>(grouped[f.object_key]??=[]).push(f));
      panel.innerHTML=`<div class="card"><h2>Labels</h2><p class="empty">Change wording without changing internal database keys.</p>${labels.map(x=>`<form class="list-row label-form" data-key="${esc(x.label_key)}"><span style="flex:1"><b>${esc(x.label_key)}</b><br><input name="label_value" value="${esc(x.label_value)}" style="width:100%;margin-top:5px"></span><button type="submit">Save</button></form>`).join("")}</div>
      <div class="card"><h2>Picklists by object</h2>${picklists.map(g=>`<div class="list-row" style="display:block"><b>${esc(g.object_key||"General")} — ${esc(g.label)}</b><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:7px">${g.values.map(v=>`<button type="button" class="pill" data-pick="${v.id}" data-group="${esc(g.group_key)}" data-value="${esc(v.value_label)}">${esc(v.value_label)} ✎</button>`).join("")}<button type="button" class="icon-btn" data-add-pick="${esc(g.group_key)}">+ Add</button></div></div>`).join("")||'<div class="empty">No configurable picklists found.</div>'}</div>
      <div class="card"><h2>Custom fields</h2><p class="empty">Add business-specific fields without changing the database schema.</p><button type="button" id="addCustomField">+ Add custom field</button>${Object.entries(grouped).map(([o,fs])=>`<div style="margin-top:12px"><b>${esc(o)}</b>${fs.map(f=>`<div class="list-row"><span>${esc(f.field_label)} <span class="meta">(${esc(f.field_type)})</span></span><button type="button" class="icon-btn edit" data-edit-field="${f.id}">Edit</button></div>`).join("")}</div>`).join("")}</div>`;
      panel.querySelectorAll(".label-form").forEach(form=>form.addEventListener("submit",async e=>{e.preventDefault();await api("/labels",{method:"POST",body:JSON.stringify({label_key:form.dataset.key,label_value:new FormData(form).get("label_value")})});toast("Label saved");renderSettings();}));
      panel.querySelectorAll("[data-add-pick]").forEach(el=>el.addEventListener("click",()=>openPick(el.dataset.addPick)));
      panel.querySelectorAll("[data-pick]").forEach(el=>el.addEventListener("click",()=>openPick(el.dataset.group,{id:Number(el.dataset.pick),value_label:el.dataset.value})));
      const openPick=(group,value)=>{ openModal(value?"Edit picklist value":"Add picklist value",`<form>${input("value_label","Value",value?.value_label||"","text","required")}${input("sort_order","Sort order",0,"number")}<button type="submit">Save</button></form>`,async d=>{await api("/picklists",{method:"POST",body:JSON.stringify({...d,group_key:group,id:value?.id}));toast("Picklist saved");renderSettings();}); };
      const openField=(f)=>openModal(f?"Edit custom field":"Add custom field",`<form><div class="field"><label>Object</label><select name="object_key">${(cfg.objects||[]).map(o=>`<option ${f?.object_key===o? "selected":""}>${o}</option>`).join("")}</select></div>${input("field_key","Field key",f?.field_key||"","text","required")}${input("field_label","Display label",f?.field_label||"","text","required")}<div class="field"><label>Type</label><select name="field_type">${["text","long_text","number","date","boolean","select","multi_select","url"].map(t=>`<option ${f?.field_type===t?"selected":""}>${t}</option>`).join("")}</select></div>${input("options","Options (comma separated)",(f?.options||[]).join(","))}<button type="submit">Save</button></form>`,async d=>{d.id=f?.id;d.options=String(d.options||"").split(",").map(x=>x.trim()).filter(Boolean);await api("/product-config/custom-fields",{method:"POST",body:JSON.stringify(d)});toast("Custom field saved");renderSettings();});
      panel.querySelector("#addCustomField").addEventListener("click",()=>openField(null)); panel.querySelectorAll("[data-edit-field]").forEach(el=>el.addEventListener("click",()=>openField((cfg.custom_fields||[]).find(f=>f.id===Number(el.dataset.editField))));
      return;
    }
    if(activeSection==="operations"){
      panel.innerHTML=`<div class="card"><h2>Business rules</h2><p class="empty">These are operational decisions the company can change without code.</p>${(cfg.rules||[]).map(r=>`<div class="list-row"><span style="flex:1"><b>${esc(r.label)}</b><br><span class="meta">${esc(r.description||"")}</span></span><button type="button" class="icon-btn edit" data-rule="${r.id}">Edit</button></div>`).join("")}</div>
      <div class="card"><h2>Task templates</h2><p class="empty">Templates generate Pre-Production, Production and Post-Production work automatically.</p>${(cfg.task_templates||[]).map(t=>`<div class="list-row"><span style="flex:1"><b>${esc(t.default_title)}</b> <span class="pill">${esc(t.phase)}</span><br><span class="meta">${esc(t.event_type_key||"All event types")} · ${t.required?"Required":"Optional"}</span></span><button type="button" class="icon-btn edit" data-template="${t.id}">Edit</button></div>`).join("")}</div>`;
      const openRule=(r)=>{const value=typeof r?.value==="object"?JSON.stringify(r.value,null,2):"{}";openModal("Business rule",`<form>${input("label","Label",r?.label||"","text","required")}${input("category","Category",r?.category||"Operations")}${input("description","Description",r?.description||"")}<div class="field"><label>Value JSON</label><textarea name="value" rows="5">${esc(value)}</textarea></div><button type="submit">Save</button></form>`,async d=>{let value;try{value=JSON.parse(d.value||"{}")}catch{throw new Error("Value must be valid JSON")}await api("/product-config/rules",{method:"POST",body:JSON.stringify({...r,value,label:d.label,category:d.category,description:d.description})});toast("Rule saved");renderSettings();});};
      panel.querySelectorAll("[data-rule]").forEach(el=>el.addEventListener("click",()=>openRule((cfg.rules||[]).find(r=>r.id===Number(el.dataset.rule)))));
      const openTemplate=t=>openModal("Task template",`<form>${input("template_key","Template key",t?.template_key||"","text","required")}${input("default_title","Task title",t?.default_title||"","text","required")}<div class="field"><label>Phase</label><select name="phase">${["Pre-Production","Production","Post-Production"].map(p=>`<option ${t?.phase===p?"selected":""}>${p}</option>`).join("")}</select></div>${input("event_type_key","Event type key",t?.event_type_key||"")}${input("sort_order","Sort order",t?.sort_order||0,"number")}<label><input name="required" type="checkbox" ${t?.required?"checked":""}> Required</label><button type="submit">Save</button></form>`,async d=>{d.required=!!d.required;await api("/product-config/task-templates",{method:"POST",body:JSON.stringify({...t,...d})});toast("Task template saved");renderSettings();}); panel.querySelectorAll("[data-template]").forEach(el=>el.addEventListener("click",()=>openTemplate((cfg.task_templates||[]).find(t=>t.id===Number(el.dataset.template))));
      return;
    }
    if(activeSection==="finance"){
      const nums=cfg.numbering||[];
      panel.innerHTML=`<div class="card"><h2>Numbering</h2><p class="empty">Configure human-friendly numbers for the business documents and records.</p>${nums.map(n=>`<form class="list-row" data-num="${esc(n.object_key)}"><span style="width:180px"><b>${esc(n.object_key)}</b></span><input name="prefix" value="${esc(n.prefix)}" style="width:100px"><label style="display:flex;align-items:center;gap:5px"><input name="include_year" type="checkbox" ${n.include_year?"checked":""}> Year</label><input name="padding" type="number" min="1" max="8" value="${n.padding}" style="width:70px"><button type="submit">Save</button></form>`).join("")}</div>
      <div class="card"><h2>Default payment rule</h2><p class="empty">Change the advance percentage used when new bookings are created.</p>${(cfg.rules||[]).filter(r=>r.rule_key==="booking.default_advance").map(r=>`<button type="button" class="icon-btn edit" id="editAdvance">Edit current: ${esc(r.value?.percent||30)}%</button>`).join("")}</div>`;
      panel.querySelectorAll("[data-num]").forEach(form=>form.addEventListener("submit",async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(form));await api("/product-config/numbering",{method:"POST",body:JSON.stringify({...d,object_key:form.dataset.num,include_year:form.querySelector('[name="include_year"]').checked})});toast("Numbering saved");renderSettings();}));
      const adv=(cfg.rules||[]).find(r=>r.rule_key==="booking.default_advance"); panel.querySelector("#editAdvance")?.addEventListener("click",()=>openModal("Default advance",`<form>${input("percent","Advance percentage",adv?.value?.percent||30,"number","min=0 max=100")}<button type="submit">Save</button></form>`,async d=>{await api("/product-config/rules",{method:"POST",body:JSON.stringify({...adv,value:{percent:Number(d.percent)}})});toast("Advance rule saved");renderSettings();}));
      return;
    }
    if(activeSection==="marketing"){
      panel.innerHTML=`<div class="card"><h2>Client relationship automation</h2><p class="empty">Use the Client 360 timeline to create follow-up opportunities without automatically sending messages.</p>${(cfg.rules||[]).filter(r=>r.category==="Marketing").map(r=>`<div class="list-row"><span><b>${esc(r.label)}</b><br><span class="meta">${esc(r.description||"")}</span></span><button type="button" class="icon-btn edit" data-rule="${r.id}">Edit</button></div>`).join("")}</div>`;
      panel.querySelectorAll("[data-rule]").forEach(el=>el.addEventListener("click",()=>{const r=(cfg.rules||[]).find(x=>x.id===Number(el.dataset.rule));openModal("Marketing rule",`<form>${input("label","Label",r.label)}<div class="field"><label>Days before</label><input name="days_before" type="number" value="${r.value?.days_before||30}"></div><label><input name="enabled" type="checkbox" ${r.value?.enabled!==false?"checked":""}> Enabled</label><button type="submit">Save</button></form>`,async d=>{await api("/product-config/rules",{method:"POST",body:JSON.stringify({...r,label:d.label,value:{days_before:Number(d.days_before),enabled:!!d.enabled}})});toast("Marketing rule saved");renderSettings();});}));
      return;
    }
    if(activeSection==="ai"){
      const a=cfg.ai||{}; const allRead=["clients","leads","quotes","bookings","events","tasks","resources","payments","expenses"]; const allWrite=["followups","quotes","tasks","resource_allocations","marketing_opportunities"]; const confirm=["delete_records","financial_changes","send_external_messages","resource_allocations"];
      panel.innerHTML=`<div class="card"><h2>AI & MCP access</h2><p class="empty">The CRM can expose controlled business actions to ChatGPT through MCP. Permissions are explicit; the AI never receives direct database access.</p>
      <form id="aiForm"><label><input name="enabled" type="checkbox" ${a.enabled?"checked":""}> Enable AI features</label><br><label><input name="mcp_enabled" type="checkbox" ${a.mcp_enabled?"checked":""}> Enable MCP access</label>
      <div class="row2" style="margin-top:12px"><div><b>Read access</b>${allRead.map(x=>`<label style="display:block"><input type="checkbox" name="read" value="${x}" ${(a.allowed_read||[]).includes(x)?"checked":""}> ${x}</label>`).join("")}</div>
      <div><b>Write access</b>${allWrite.map(x=>`<label style="display:block"><input type="checkbox" name="write" value="${x}" ${(a.allowed_write||[]).includes(x)?"checked":""}> ${x}</label>`).join("")}</div></div>
      <div style="margin-top:12px"><b>Always require confirmation</b>${confirm.map(x=>`<label style="display:block"><input type="checkbox" name="confirm" value="${x}" ${(a.confirmation_required||[]).includes(x)?"checked":""}> ${x}</label>`).join("")}</div>
      <button type="submit" style="margin-top:12px">Save AI permissions</button></form></div>`;
      panel.querySelector("#aiForm").addEventListener("submit",async e=>{e.preventDefault();const fd=new FormData(e.target);await api("/product-config/ai",{method:"POST",body:JSON.stringify({enabled:fd.has("enabled"),mcp_enabled:fd.has("mcp_enabled"),allowed_read:fd.getAll("read"),allowed_write:fd.getAll("write"),confirmation_required:fd.getAll("confirm")})});toast("AI permissions saved");renderSettings();});
      return;
    }
    if(activeSection==="audit"){
      const logs=await api("/product-config/audit?limit=100");
      panel.innerHTML=`<div class="card"><h2>Configuration audit</h2><p class="empty">Every configuration change is recorded with actor, source, before and after state.</p><table><thead><tr><th>When</th><th>Actor</th><th>Action</th><th>Object</th><th>Source</th></tr></thead><tbody>${logs.map(x=>`<tr><td>${esc(x.created_at)}</td><td>${esc(x.actor_email||"")}</td><td>${esc(x.action)}</td><td>${esc(x.object_key||"")}</td><td>${esc(x.source)}</td></tr>`).join("")||'<tr><td colspan="5" class="empty">No configuration changes yet.</td></tr>'}</tbody></table></div>`;
    }
  };

  main.innerHTML=`<h1>${L("nav.settings","Settings")}</h1><p class="empty" style="margin-top:-10px;margin-bottom:16px">One-time business setup. Configure the CRM once, then operate without changing code.</p>
    <div class="card"><div class="segmented" id="settingsSections">${sectionNames.map(([k,v])=>`<button type="button" class="seg ${k===activeSection?"active":""}" data-settings-section="${k}">${v}</button>`).join("")}</div></div>
    <div id="settingsPanel"></div>`;
  main.querySelectorAll("[data-settings-section]").forEach(btn=>btn.addEventListener("click",()=>{activeSection=btn.dataset.settingsSection;main.querySelectorAll("[data-settings-section]").forEach(x=>x.classList.toggle("active",x===btn));renderSection();}));
  renderSection();
}
// ── Reports ────────────────────────────────────────────────
const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
async function renderReports() {
  const [profitability, monthly, quarterly, seasonality] = await Promise.all([
    api("/reports/profitability"), api("/reports/monthly"), api("/reports/quarterly"), api("/reports/seasonality"),
  ]);
  const avgSeasonRevenue = seasonality.length ? seasonality.reduce((s,r)=>s+r.revenue,0) / seasonality.length : 0;
  main.innerHTML = `
    <h1>Reports</h1>
    <div class="kpis">
      <div class="kpi"><div class="l">Total revenue (all events)</div><div class="v">${money(profitability.totals.revenue)}</div></div>
      <div class="kpi"><div class="l">Total cost</div><div class="v">${money(profitability.totals.cost)}</div></div>
      <div class="kpi"><div class="l">Total profit</div><div class="v" style="color:var(--success)">${money(profitability.totals.profit)}</div></div>
    </div>
    <div class="card"><h2>Monthly P&L (trailing 12 months)</h2>
      <table><thead><tr><th>Month</th><th>Events</th><th>Revenue</th><th>Event cost</th><th>Cash collected</th><th>Overhead</th><th>Net profit</th></tr></thead>
      <tbody>${monthly.map(m => `<tr><td>${m.month}</td><td>${m.events}</td><td>${money(m.revenue)}</td><td>${money(m.cost)}</td><td>${money(m.cash_collected)}</td><td>${money(m.overhead_cost)}</td><td style="color:${m.net_profit>=0?'var(--success)':'var(--critical)'}">${money(m.net_profit)}</td></tr>`).join("") || `<tr><td colspan="7" class="empty">No dated events yet.</td></tr>`}</tbody></table>
    </div>
    <div class="row2">
      <div class="card"><h2>Quarterly (event-level)</h2>
        <table><thead><tr><th>Quarter</th><th>Events</th><th>Revenue</th><th>Profit</th></tr></thead>
        <tbody>${quarterly.map(q => `<tr><td>${q.quarter}</td><td>${q.events}</td><td>${money(q.revenue)}</td><td style="color:${q.profit>=0?'var(--success)':'var(--critical)'}">${money(q.profit)}</td></tr>`).join("") || `<tr><td colspan="4" class="empty">Not enough history yet.</td></tr>`}</tbody></table>
      </div>
      <div class="card"><h2>Seasonality — by calendar month, all years <span class="meta">below-average months are your off-season</span></h2>
        <table><thead><tr><th>Month</th><th>Events</th><th>Revenue</th></tr></thead>
        <tbody>${seasonality.map(s => `<tr>${s.revenue < avgSeasonRevenue ? `<td style="color:var(--warning);font-weight:700;">${MONTH_NAMES[Number(s.month_num)-1]} ⚠ off-season</td>` : `<td>${MONTH_NAMES[Number(s.month_num)-1]}</td>`}<td>${s.events}</td><td>${money(s.revenue)}</td></tr>`).join("") || `<tr><td colspan="3" class="empty">Not enough history yet.</td></tr>`}</tbody></table>
      </div>
    </div>
    <div class="card"><h2>Profitability per event</h2>
      <table><thead><tr><th>Account</th><th>Event</th><th>Revenue</th><th>Cost</th><th>Profit</th><th>Margin</th></tr></thead>
      <tbody>${profitability.events.map(e => `<tr class="clickable" data-event="${e.id}"><td>${e.account_name}</td><td>${e.type} <span style="color:var(--ink-soft);font-size:11.5px">${e.event_date||""}</span></td><td>${money(e.quote_total)}</td><td>${money(e.cost)}</td><td style="color:${e.profit>=0?'var(--success)':'var(--critical)'}">${money(e.profit)}</td><td>${e.margin_pct}%</td></tr>`).join("") || `<tr><td colspan="6" class="empty">No events yet.</td></tr>`}</tbody></table>
    </div>
  `;
  main.querySelectorAll("[data-event]").forEach(el => el.addEventListener("click", () => go("eventDetail", el.dataset.event)));
}

// Bootstrap: a reload keeps whatever view/id/filter is already in the URL
// (that's the whole fix for "refresh always dumps me back on Dashboard")
// — only a truly fresh load with no hash at all defaults to the dashboard.
if (location.hash) syncFromHash();
else go("dashboard");
